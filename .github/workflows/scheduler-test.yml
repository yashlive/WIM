name: WIM Scheduler Test

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Print scheduler timestamp
        run: |
          echo "Scheduler test started"
          date -u
          echo "GitHub event: $GITHUB_EVENT_NAME"
