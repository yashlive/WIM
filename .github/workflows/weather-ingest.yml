name: WIM Weather Ingest

on:
  schedule:
    # TEMP TEST: run automatically every 5 minutes
    - cron: "*/5 * * * *"

  # Also allows manual testing from GitHub Actions
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Workflow lives on main, but weather code comes from dev
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-worker.txt

      - name: Fetch and persist forecasts
        env:
          # Supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          # AccuWeather
          ACCUWEATHER_KEY: ${{ secrets.ACCUWEATHER_KEY }}

          # Tomorrow.io
          TOMORROWIO_KEY: ${{ secrets.TOMORROWIO_KEY }}

          # OpenWeather
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          OPENWEATHER_ONECALL_ENABLED: ${{ secrets.OPENWEATHER_ONECALL_ENABLED }}

          # Weatherstack
          WEATHERSTACK_KEY: ${{ secrets.WEATHERSTACK_KEY }}
          WEATHERSTACK_ENABLED: ${{ secrets.WEATHERSTACK_ENABLED }}

          # IMD - optional for now
          IMD_API_KEY: ${{ secrets.IMD_API_KEY }}
          IMD_AUTH_HEADER: ${{ secrets.IMD_AUTH_HEADER }}
          IMD_AUTH_PREFIX: ${{ secrets.IMD_AUTH_PREFIX }}

        run: python weather_worker.py
